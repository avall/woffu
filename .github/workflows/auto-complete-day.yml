name: Auto Complete Day

# Fills and confirms today's presence slots in Woffu via API every weekday,
# in the evening Europe/Madrid time.
#
# GitHub cron has no timezone support, so a single 19:00 UTC tick lands at 21:00
# Madrid in summer (CEST) and 20:00 in winter (CET). Running early in the evening
# is deliberate: GitHub queues scheduled runs and routinely starts them 5-30 min
# late, and this leaves 3-4h of slack before midnight. If a run ever drifted past
# midnight the script would compute the *next* day and fill a day that has not
# happened yet.
#
# The guard is that backstop: it is a lower bound (>= 20:00 Madrid), so ordinary
# queue delays still pass, but a run that slipped into the small hours does not.
# An equality check would silently drop whole days whenever GitHub ran on time.
#
# Uses the same secrets as `sign.yml`:
#   WOFFU_URL          Main Woffu URL (e.g. https://app.woffu.com)
#   WOFFU_COMPANY_URL  Company-scoped URL (e.g. https://acme.woffu.com)
#   WOFFU_EMAIL        Login email
#   WOFFU_PASSWORD     Login password
# Optional:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  For failure notifications

on:
  schedule:
    - cron: '0 19 * * 1-5'  # 21:00 Madrid (CEST) / 20:00 Madrid (CET)
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Generate slots but do not call the API'
        required: false
        type: boolean
        default: false

concurrency:
  group: auto-complete-day
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  complete-day:
    name: Complete day in Woffu
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "now_utc=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "now_madrid=$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Madrid-time guard
        id: guard
        run: |
          MADRID_HOUR=$(TZ=Europe/Madrid date '+%H')
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$MADRID_HOUR" -lt 20 ]; then
            echo "Madrid hour=$MADRID_HOUR (before 20). Skipping this cron tick."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Random delay
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'schedule'
        run: sleep $(( RANDOM % 300 + 1 ))

      - name: Complete day
        if: steps.guard.outputs.skip != 'true'
        env:
          WOFFU_URL: ${{ secrets.WOFFU_URL }}
          WOFFU_COMPANY_URL: ${{ secrets.WOFFU_COMPANY_URL }}
          WOFFU_EMAIL: ${{ secrets.WOFFU_EMAIL }}
          WOFFU_PASSWORD: ${{ secrets.WOFFU_PASSWORD }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            node .github/scripts/woffu-complete-day.mjs --dry-run
          else
            node .github/scripts/woffu-complete-day.mjs
          fi

      - name: Notify failure
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="❌ woffu auto-complete-day failed at $(TZ=Europe/Madrid date '+%H:%M %Z %Y-%m-%d')"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="${MSG}" > /dev/null
          fi
